name: CI — playwright-ai-agents-skill

on:
  push:
    branches: [main]
    paths: ['playwright-ai-agents-skill/**']
  pull_request:
    paths: ['playwright-ai-agents-skill/**']

defaults:
  run:
    working-directory: playwright-ai-agents-skill

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar archivos clave
        run: |
          test -f skills/playwright-ai-agents/SKILL.md
          test -f scripts/classify-failures.mjs
          test -f references/estrategia-ia.md
          test -f references/failure-taxonomy.md
          test -f references/healing-guardrails.md
          test -f references/model-routing.md
          test -f references/metrics.md
          test -f examples/HEALER_PROMPT.md
          test -f examples/PLAN_TRANSFERENCIAS.md
          echo "archivos OK"

      - name: Classifier — salida estable contra CLASIF_EJEMPLO.json
        run: |
          node scripts/classify-failures.mjs \
            --input examples/playwright-results.sample.json \
            --out   /tmp/CLASIF_CI.json
          node -e "
            const a = require('/tmp/CLASIF_CI.json');
            const b = require('./examples/CLASIF_EJEMPLO.json');
            if (JSON.stringify(a) !== JSON.stringify(b)) { console.error('CLASIF difiere'); process.exit(1); }
            console.log('classifier OK');
          "

      - name: Taxonomía sincronizada con RULES
        run: |
          node --input-type=module -e "
            import { RULES } from './scripts/classify-failures.mjs';
            import { readFileSync } from 'node:fs';
            const doc = readFileSync('references/failure-taxonomy.md', 'utf8');
            const missing = RULES.filter((r) => !doc.includes('\`' + r.id + '\`'));
            if (missing.length) { console.error('Sin documentar:', missing.map((r) => r.id)); process.exit(1); }
            console.log('taxonomía OK');
          "

      - name: Validar TypeScript de ejemplos
        run: |
          npm install --no-save typescript @playwright/test @types/node --silent
          npx tsc --noEmit --strict --module esnext --moduleResolution bundler --target es2022 --skipLibCheck --types node \
            examples/seed.spec.ts \
            examples/T_TRANSFERENCIA_EXITOSA.spec.ts \
            examples/pages/TransfersPage.ts \
            && echo "TS OK"

      - name: Validar pipeline YML
        run: |
          python3 -c "import yaml; yaml.safe_load(open('examples/Y_EXAMPLE_playwright_ai.yml'))" \
            && echo "Y_ OK"
